server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  # The API bodies are tiny (the backend caps them at 10kb).
  client_max_body_size 16k;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;
  # The frontend has no inline script/style and no third-party origins.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # The frontend has its own src/api/ layer (ES modules). Serve those files from disk;
  # regex locations win over the /api/ prefix below. No backend route ends in .js.
  location ~ ^/api/.+\.js$ {
    try_files $uri =404;
  }

  location /api/ {
    # No URI on proxy_pass: preserves the /api/... path.
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrites (does not append to) the client-supplied header, so it cannot be spoofed to dodge the backend limiter.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
