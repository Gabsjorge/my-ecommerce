services:
  db:
    # Ephemeral database: nothing persists, no ports published.
    tmpfs:
      - /var/lib/postgresql/data

  migrate:
    environment:
      NODE_ENV: test

  backend:
    environment:
      NODE_ENV: test

  backend-test:
    profiles: ['tools']
    build: { context: ./backend, target: dev }
    command: ['npm', 'test']
    environment:
      NODE_ENV: test
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      CART_INACTIVITY_TIMEOUT_SECONDS: ${CART_INACTIVITY_TIMEOUT_SECONDS:-600}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  e2e:
    profiles: ['tools']
    build: ./e2e
    environment:
      BASE_URL: http://frontend:8080
    depends_on:
      frontend: { condition: service_healthy }
    ipc: host
    init: true
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
